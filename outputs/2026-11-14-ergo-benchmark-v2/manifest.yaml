project: Бенчмарк скилла ergo-break-the-loop, версия 2
status: live_run_void_quota_losses
raw_inputs:
  - ~/.agents/skills/ergo-break-the-loop/SKILL.md
  - library/ergo/canon.md
  - ~/ГЛАВНАЯ ПАПКА/КАНОН_ATQEC/ATQEC — Kerg.md
  - ~/ГЛАВНАЯ ПАПКА/КАНОН_ATQEC/ATQEC — Паспорт предсказания.md
  - ~/ГЛАВНАЯ ПАПКА/УРОКИ_И_ГРАБЛИ.md
seed: 0 (temperature 0, детерминированный парный дизайн, BENCH_REPEATS=3)
commands:
  - node code/metric-controls.mjs
  - node code/oracle-controls.mjs
  - BENCH_MODEL=qwen-3.8-27b:free BENCH_REPEATS=3 node code/run-bench.mjs both all (провайдер LiteRouter)
  - BENCH_MODEL=cohere/north-mini-code:free BENCH_REPEATS=3 node code/run-bench.mjs both d (провайдер OpenRouter)
outputs:
  - code/run-bench.mjs
  - code/loop-metric.mjs
  - code/oracle.mjs
  - PREREGISTRATION.md
  - results.md
publication_status: internal
